<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Film strip">
  <!-- Film strip, slightly tilted, in the accent red -->
  <defs>
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6170"/>
      <stop offset="1" stop-color="#b61834"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-12 32 32)">
    <rect x="6" y="14" width="52" height="36" rx="5" fill="url(#strip)"/>
    <!-- perforations, top and bottom -->
    <g fill="#0b0c13">
      <rect x="10" y="17" width="5" height="4" rx="1"/><rect x="19" y="17" width="5" height="4" rx="1"/>
      <rect x="28" y="17" width="5" height="4" rx="1"/><rect x="37" y="17" width="5" height="4" rx="1"/>
      <rect x="46" y="17" width="5" height="4" rx="1"/>
      <rect x="10" y="43" width="5" height="4" rx="1"/><rect x="19" y="43" width="5" height="4" rx="1"/>
      <rect x="28" y="43" width="5" height="4" rx="1"/><rect x="37" y="43" width="5" height="4" rx="1"/>
      <rect x="46" y="43" width="5" height="4" rx="1"/>
    </g>
    <!-- two frames -->
    <rect x="11" y="24" width="19" height="16" rx="2" fill="#0b0c13" opacity=".55"/>
    <rect x="34" y="24" width="19" height="16" rx="2" fill="#0b0c13" opacity=".55"/>
  </g>
</svg>
