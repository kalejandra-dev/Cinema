{% extends "base.html" %}
{% block title %}Edit {{ item.name }}{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Edit item</h1>
  <form action="{{ url_for('admin.edit_food_post', food_id=item.id) }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" value="{{ item.name }}" required>
    <label for="description">Description</label>
    <textarea id="description" name="description" rows="3">{{ item.description }}</textarea>
    <label for="price">Price (€)</label>
    <input id="price" name="price" type="number" step="0.01" min="0" value="{{ item.price }}" required>
    <label class="checkbox">
      <input type="checkbox" name="available" {% if item.available %}checked{% endif %}> Available
    </label>
    <button type="submit" class="btn btn-block">Save changes</button>
  </form>
  <p class="form-footer"><a href="{{ url_for('admin.manage_food') }}">Cancel</a></p>
</section>
{% endblock %}
