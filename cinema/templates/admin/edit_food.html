{% extends "base.html" %}
{% block title %}Edit {{ item.name }}{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Edit item</h1>
  <form action="{{ url_for('admin.edit_food_post', food_id=item.id) }}" method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" value="{{ item.name }}" required>
    <label for="description">Description</label>
    <textarea id="description" name="description" rows="3">{{ item.description }}</textarea>
    <label for="category">Category</label>
    <select id="category" name="category" required>
      {% for category in categories %}
      <option value="{{ category.name }}" {% if category == item.category %}selected{% endif %}>{{ category.title }}</option>
      {% endfor %}
    </select>
    <label for="detail">Detail (size, volume...)</label>
    <input id="detail" name="detail" type="text" value="{{ item.detail }}">
    <label for="image">New image (optional, max 2 MiB){% if item.image_data %} · it has one now{% endif %}</label>
    <input id="image" name="image" type="file" accept="image/*">
    <label for="price">Price (€)</label>
    <input id="price" name="price" type="number" step="0.01" min="0" value="{{ item.price }}" required>
    <label class="checkbox">
      <input type="checkbox" name="available" {% if item.available %}checked{% endif %}> Available
    </label>
    <button type="submit" class="btn btn-block">Save changes</button>
  </form>
  <p class="form-footer"><a href="{{ url_for('admin.manage_food') }}">Cancel</a></p>
</section>
{% endblock %}
