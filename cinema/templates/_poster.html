{# Reusable poster: shows the movie poster stored in the database, otherwise a placeholder #}
{% if movie.poster_data %}
  <img class="poster {{ extra_class }}" alt="{{ movie.title }} poster"
       src="{{ url_for('main.movie_poster', movie_id=movie.id) }}">
{% else %}
  <div class="poster poster-placeholder {{ extra_class }}"><span>{{ movie.title }}</span></div>
{% endif %}
