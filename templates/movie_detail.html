<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ movie.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>{{ movie.title }}</h1>
    <p>Duration: {{ movie.duration }} min</p>
    <p>Price: {{ "%.2f"|format(movie.price) }} €</p>
    <a href="{{ url_for('booking', movie_id=movie.id) }}">Book a seat</a>
    <br><a href="{{ url_for('index') }}">← Back</a>
</body>
</html>
