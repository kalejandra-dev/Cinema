<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My bookings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>My bookings</h1>

    {% if bookings %}
        <table>
            <tr>
                <th>Movie</th><th>Date</th><th>Time</th><th>Seats</th><th>Total</th>
            </tr>
            {% for b in bookings %}
                <tr>
                    <td>{{ b.showtime.movie.title }}</td>
                    <td>{{ b.showtime.date }}</td>
                    <td>{{ b.showtime.time.strftime('%H:%M') }}</td>
                    <td>{{ b.num_seats }}</td>
                    <td>{{ "%.2f"|format(b.total_price) }} €</td>
                </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>You have no bookings yet.</p>
    {% endif %}

    <a href="{{ url_for('index') }}">← Back</a>
</body>
</html>
