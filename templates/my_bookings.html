<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My bookings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>My bookings</h1>

    {% if bookings %}
        <ul>
            {% for b in bookings %}
                <li>Movie #{{ b.movie_id }} — seats {{ b.seats|join(', ') }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You have no bookings yet.</p>
    {% endif %}

    <a href="{{ url_for('index') }}">← Back</a>
</body>
</html>
